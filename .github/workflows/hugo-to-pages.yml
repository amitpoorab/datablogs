name: Hugo → Build & Deploy to GitHub Pages

on:
  push:
    branches: [hugo-source]
  pull_request:
    branches: [hugo-source]
  workflow_dispatch:              # allows manual trigger from GitHub UI

# These permissions are required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive           # critical for PaperMod theme
          fetch-depth: 1                  # shallow clone for speed; enableGitInfo still works

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true                  # needed for SCSS, processing, etc.

      - name: Build static site
        run: hugo --gc --minify --buildDrafts=false --baseURL "https://amitpoorab.github.io/datablogs/"

      - name: Upload artifact (built site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4